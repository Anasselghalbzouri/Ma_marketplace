# GÉNÉRÉ par specs/003-contrat-api/tooling/build_contract.py — T-003 — statut : Proposé (CP-1)
# Vérification : uv run --no-project --with pyyaml --with openapi-spec-validator --with jsonschema python specs/003-contrat-api/validation/check_contract.py
openapi: 3.1.0
info:
  title: Marketplace produits locaux Maroc — API V1
  version: 1.0.0-proposed
  description: 'Contrat d''API de la V1 (T-003). Statut : **Proposé — à valider par @user (CP-1)**.


    Sources : cahier des charges v1.1 (validé, D45), UC-DIAG-01..03, SEQ-001..003, STATE-001..004 (approuvés 2026-10-12),
    schéma T-002, conventions de socle T-001.


    Conventions : préfixe /api/v1 (ADR-007) ; JSON en anglais snake_case (Constitution IX, ADR-016) ; messages en français
    ; montants en chaîne décimale MAD (ADR-018) ; dates ISO 8601 UTC ; erreurs {error:{code,message,details}} (catalogue error-codes.md)
    ; pagination page/per_page ; jeton porteur (ADR-006) ; refus de rôle = 403, ressource d''un autre titulaire = 404 (ADR-017)
    ; transitions d''état en POST sur sous-ressource verbale, transition interdite = 409 (ADR-020).


    Extensions : x-module, x-roles, x-ownership, x-uc, x-matrix-rows (authorization-matrix.yaml), x-plan-task, x-request-example,
    x-blocked-by, x-hypothesis.'
servers:
- url: http://localhost:8080
  description: local (docker-compose, T-004)
- url: https://staging.example.invalid
  description: staging — nommé seulement (étape 6)
- url: https://api.example.invalid
  description: prod — nommé seulement (étape 6)
tags:
- name: M01 — Comptes et accès
- name: M02 — Boutique et catalogue vendeur
- name: M03 — Découverte
- name: M04 — Panier et commande
- name: M05 — Commandes vendeur
- name: M06 — Livraison et encaissement
- name: M07 — Reversements vendeurs
- name: M08 — Avis et notes
- name: M09 — Administration et modération
- name: M10 — Notifications
- name: M11 — Retours
- name: SOCLE — Socle transverse (paramètres, photos, audit)
paths:
  /api/v1/auth/register:
    post:
      operationId: registerCustomer
      tags:
      - M01 — Comptes et accès
      summary: Créer un compte client et se connecter
      description: 'CA-F001-1/2. Si X-Cart-Token est fourni, le panier visiteur est rattaché au nouveau compte (CA-F001-3,
        ADR-019). Récupération d''accès : non contractualisée, [NEEDS CLARIFICATION: M-06/Q23, T-015 bloquée].'
      parameters:
      - name: X-Cart-Token
        in: header
        required: false
        description: Jeton opaque du panier visiteur (ADR-019). Absent pour un client connecté.
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{32,64}$
        example: b3f1c2d4e5f6a7b8c9d0e1f2a3b4c5d6
      security:
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
            examples:
              request:
                summary: Exemple de requête
                value:
                  name: Salma B.
                  phone: '+212600000041'
                  password: <mot-de-passe>
                  email: null
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthToken'
                additionalProperties: false
                required:
                - data
              examples:
                success:
                  summary: Succès
                  value:
                    data:
                      token: <jeton-opaque>
                      token_type: Bearer
                      expires_at: '2026-10-21T10:00:00Z'
                      user:
                        id: 41
                        role: customer
                        phone: '+212600000041'
        '409':
          description: Téléphone déjà utilisé ; la connexion est proposée (CA-F001-2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                phone_already_registered:
                  summary: Ce numéro est déjà utilisé. Connectez-vous.
                  value:
                    error:
                      code: phone_already_registered
                      message: Ce numéro est déjà utilisé. Connectez-vous.
                      details:
                        suggested_action: login
        '422':
          description: Données invalides ; details.fields liste les champs en erreur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_failed:
                  summary: Certaines informations sont invalides.
                  value:
                    error:
                      code: validation_failed
                      message: Certaines informations sont invalides.
                      details:
                        fields:
                          <champ>:
                          - <message>
      x-module: M01
      x-roles:
      - visitor
      x-ownership: none
      x-uc:
      - UC-004
      x-matrix-rows:
      - MX-01
      x-plan-task: T-014
      x-request-example:
        method: POST
        url: /api/v1/auth/register
        headers:
          X-Cart-Token: b3f1c2d4e5f6a7b8c9d0e1f2a3b4c5d6
          Content-Type: application/json
