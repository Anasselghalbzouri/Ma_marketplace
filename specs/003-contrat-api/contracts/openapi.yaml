        seller_id:
          $ref: '#/components/schemas/Id'
        legal_name:
          type: string
        payout_method:
          $ref: '#/components/schemas/PayoutMethod'
        available_total:
          $ref: '#/components/schemas/Money'
        pending_deductions_total:
          $ref: '#/components/schemas/Money'
        payable_amount:
          $ref: '#/components/schemas/Money'
        negative_balance:
          type: boolean
      additionalProperties: false
      required:
      - seller_id
      - legal_name
      - payout_method
      - available_total
      - pending_deductions_total
      - payable_amount
      - negative_balance
    PayoutWrite:
      type: object
      properties:
        seller_id:
          $ref: '#/components/schemas/Id'
        period_start:
          type: string
          format: date
        paid_on:
          type: string
          format: date
        method:
          $ref: '#/components/schemas/PayoutMethod'
        cash_proof:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Requis si method = cash (HYPOTHÈSE F011).
      additionalProperties: false
      required:
      - seller_id
      - period_start
      - paid_on
      - method
    AdminSeller:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        legal_name:
          type: string
        phone:
          $ref: '#/components/schemas/Phone'
        seller_commune:
          $ref: '#/components/schemas/ReferenceItem'
        payout_method:
          $ref: '#/components/schemas/PayoutMethod'
        bank_details:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/SellerStatus'
        suspended_at:
          type:
          - string
          - 'null'
          format: date-time
        shop:
          $ref: '#/components/schemas/Shop'
        open_sub_orders_count:
          type: integer
          format: int64
          minimum: 0
        open_returns_count:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
      required:
      - id
      - legal_name
      - phone
      - seller_commune
      - payout_method
      - bank_details
      - status
      - suspended_at
      - shop
      - open_sub_orders_count
      - open_returns_count
    AuditEntry:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        occurred_at:
          type: string
          format: date-time
        actor_user_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        actor_system:
          type:
          - string
          - 'null'
        action_type:
          $ref: '#/components/schemas/AuditActionType'
        target_type:
          type: string
        target_id:
          $ref: '#/components/schemas/Id'
        from_status:
          type:
          - string
          - 'null'
        to_status:
          type:
          - string
          - 'null'
        amount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        reason:
          type:
          - string
          - 'null'
        corrects_entry_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - occurred_at
      - actor_user_id
      - actor_system
      - action_type
      - target_type
      - target_id
      - from_status
      - to_status
      - amount
      - reason
      - corrects_entry_id
    AuditActionType:
      type: string
      enum:
      - order_status_changed
      - sub_order_status_changed
      - delivery_status_recorded
      - cash_collected
      - fund_remittance_recorded
      - cash_discrepancy_recorded
      - seller_amount_held
      - seller_amount_released
      - seller_amount_deducted
      - return_status_changed
      - return_pickup_recorded
      - return_fee_charged
      - dispute_decided
      - refund_recorded
      - deduction_recorded
      - payout_recorded
      - correction
      - scheduled_task_run
      description: Type d'action auditée, valeurs identiques à audit_entries.action_type (T-002).
    Notification:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
        title:
          type: string
        body:
          type: string
        data:
          type: object
        read_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - type
      - title
      - body
      - data
      - read_at
      - created_at
    Setting:
      type: object
      properties:
        key:
          type: string
        value:
          type:
          - string
          - number
          - integer
          - boolean
          - 'null'
        value_type:
          type: string
          enum:
          - string
          - integer
          - decimal
          - boolean
        description:
          type: string
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - key
      - value
      - value_type
      - description
      - updated_at
    SettingWrite:
      type: object
      properties:
        value:
          type:
          - string
          - number
          - integer
          - boolean
          - 'null'
      additionalProperties: false
      required:
      - value
x-error-codes:
  malformed_request:
    http_status: 400
    description: Requête mal formée (JSON invalide, paramètre de type incorrect).
  unauthenticated:
    http_status: 401
    description: Jeton absent, invalide ou expiré.
  invalid_credentials:
    http_status: 401
    description: Téléphone ou mot de passe incorrect, sans préciser lequel (F001).
  forbidden:
    http_status: 403
    description: Rôle non autorisé pour cette action (matrice, ADR-017).
  account_suspended:
    http_status: 403
    description: 'Compte vendeur suspendu : actions d''écriture refusées (RG-015 ; HYPOTHÈSE).'
  not_found:
    http_status: 404
    description: Ressource inexistante, non visible publiquement, ou appartenant à un autre titulaire (ADR-017).
  invalid_transition:
    http_status: 409
    description: Transition d'état interdite depuis l'état courant (STATE-001..004).
  phone_already_registered:
    http_status: 409
    description: Téléphone déjà utilisé ; la connexion est proposée (CA-F001-2).
  insufficient_stock:
    http_status: 409
    description: Stock insuffisant à la validation ; le panier est mis à jour (F007).
  product_unavailable:
    http_status: 409
    description: Produit indisponible (stock 0, masqué, vendeur suspendu) — CA-F003-2.
  payout_already_recorded:
    http_status: 409
    description: Reversement déjà enregistré pour ce vendeur et cette semaine (idempotence).
  duplicate_name:
    http_status: 409
    description: Nom déjà utilisé dans le référentiel.
  resource_in_use:
    http_status: 409
    description: 'Suppression impossible : la ressource est référencée.'
  validation_failed:
    http_status: 422
    description: Données invalides ; details.fields liste les champs en erreur.
  commune_not_allowed:
    http_status: 422
    description: Commune hors de la liste autorisée (CA-F002-3).
  city_not_served:
    http_status: 422
    description: Adresse hors des villes desservies — seule Tanger en V1 (CA-F007-2).
  cart_empty:
    http_status: 422
    description: Panier vide ou sans produit disponible.
  return_not_eligible:
    http_status: 422
    description: Retour impossible ; details.reason = ReturnIneligibility (CA-F022-2/3/8).
  review_not_allowed:
    http_status: 422
    description: 'Avis impossible : commande non « livrée et payée » (RG-011).'
  file_rejected:
    http_status: 422
    description: Fichier refusé (type ou taille), FR-040.
  nothing_to_pay_out:
    http_status: 422
    description: Aucun montant positif à reverser (solde nul ou négatif reporté, H-07).
  feature_blocked:
    http_status: 501
    description: Action prévue au contrat mais bloquée par une décision manquante (U-01, U-02).
  rate_limited:
    http_status: 429
    description: Trop de requêtes.
  server_error:
    http_status: 500
    description: Erreur interne, sans détail d'implémentation.
