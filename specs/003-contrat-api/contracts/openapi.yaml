  /api/v1/photos:
    post:
      operationId: uploadPhoto
      tags:
      - SOCLE — Socle transverse (paramètres, photos, audit)
      summary: Téléverser une photo (produit ou retour)
      description: Contrôle du type réel et de la taille (FR-040) ; nom généré (FR-042) ; variante mobile différée (ADR-004).
        La photo n'est utilisable que par son propriétaire (owner_user_id).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
              additionalProperties: false
              required:
              - file
            examples:
              photo:
                summary: Image JPEG
                value:
                  file: <binaire image/jpeg>
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PhotoFile'
                additionalProperties: false
                required:
                - data
              examples:
                success:
                  summary: Succès
                  value:
                    data:
                      id: 501
                      mime_type: image/jpeg
                      size_bytes: 284112
                      mobile_url: https://cdn.example.ma/p/7f3a9c-mobile.jpg
        '401':
          description: Jeton absent, invalide ou expiré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
