        in: header
        required: false
        description: Jeton opaque du panier visiteur (ADR-019). Absent pour un client connecté.
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{32,64}$
        example: b3f1c2d4e5f6a7b8c9d0e1f2a3b4c5d6
      security:
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              request:
                summary: Exemple de requête
                value:
                  phone: '+212600000041'
                  password: <mot-de-passe>
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthToken'
                additionalProperties: false
                required:
                - data
              examples:
                success:
                  summary: Succès
                  value:
                    data:
                      token: <jeton-opaque>
                      token_type: Bearer
                      expires_at: '2026-10-21T10:00:00Z'
                      user:
                        id: 41
                        role: customer
                        phone: '+212600000041'
        '401':
          description: Téléphone ou mot de passe incorrect, sans préciser lequel (F001).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_credentials:
                  summary: Téléphone ou mot de passe incorrect.
                  value:
                    error:
                      code: invalid_credentials
                      message: Téléphone ou mot de passe incorrect.
        '422':
          description: Données invalides ; details.fields liste les champs en erreur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_failed:
                  summary: Certaines informations sont invalides.
                  value:
                    error:
                      code: validation_failed
                      message: Certaines informations sont invalides.
                      details:
                        fields:
                          <champ>:
                          - <message>
      x-module: M01
      x-roles:
